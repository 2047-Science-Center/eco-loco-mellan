<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Maktspelet — Strategicoach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700;800&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* ── House-tokens ur spel.html / spelledare.html — coachen hör till samma kontrollbord ── */
  :root{
    --bg:#121009; --panel:#211E17; --panel2:#2A261D; --panel3:#0C0B07;
    --edge:#4A443A; --edge2:#5C5547; --gold:#C9A94F; --text:#F2ECDD; --dim:#B8AF9A;
    --led:#F0B33C; --led-red:#F0564B; --led-green:#3DD68C;
    --aker:#D4A53C; --skog:#1F6E57; --tundra:#C96F2E; --stad:#7E8794;
    --font-disp:"Oxanium","Avenir Next",system-ui,sans-serif;
    --font-num:"Chakra Petch",ui-monospace,Menlo,monospace;
    /* emil: starka custom-kurvor, inte de svaga inbyggda */
    --ease-out:cubic-bezier(.23,1,.32,1);
    --tap:64px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(1200px 700px at 80% -12%, rgba(201,169,79,.10), transparent 60%), var(--bg);
    color:var(--text); font-family:var(--font-disp); overflow:hidden; height:100vh; height:100dvh;
  }
  #app{height:100dvh;display:flex;flex-direction:column;padding:16px 20px;gap:14px}

  /* ── Topbar ── */
  .topbar{display:flex;align-items:center;gap:16px;background:var(--panel3);
    border:3px solid var(--edge);border-radius:16px;padding:12px 20px;flex:none}
  .brand{display:flex;align-items:center;gap:14px}
  .brand .logo{width:54px;height:54px;border-radius:14px;flex:none;
    background:linear-gradient(145deg,#2d8a63,#1F6E57);border:3px solid var(--gold);
    display:grid;place-items:center;font-size:30px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
  .brand h1{margin:0;font-size:25px;font-weight:800;letter-spacing:.5px}
  .brand p{margin:2px 0 0;font-size:12px;color:var(--gold);letter-spacing:2px;font-weight:700;text-transform:uppercase}
  .status{margin-left:auto;display:flex;align-items:center;gap:10px;font-family:var(--font-num);
    font-size:13px;font-weight:700;color:var(--dim);background:var(--panel2);
    border:2px solid var(--edge);border-radius:999px;padding:8px 16px}
  .status .dot{width:11px;height:11px;border-radius:50%;background:var(--dim);
    box-shadow:0 0 8px currentColor;transition:background 200ms var(--ease-out)}
  .status.live{color:var(--led-green)} .status.live .dot{background:var(--led-green)}
  .status.demo{color:var(--led)} .status.demo .dot{background:var(--led)}
  .status.off{color:var(--led-red)} .status.off .dot{background:var(--led-red)}

  /* ── Huvudyta: chatt + snabbfrågor (liggande) ── */
  .main{flex:1;display:flex;gap:16px;min-height:0}
  .chatwrap{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--panel);
    border:3px solid var(--edge);border-radius:18px;overflow:hidden}
  .chat{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}

  .msg{max-width:80%;padding:14px 18px;border-radius:16px;font-size:20px;line-height:1.5;
    opacity:0;transform:translateY(10px) scale(.985);
    transition:opacity 260ms var(--ease-out),transform 260ms var(--ease-out)}
  .msg.show{opacity:1;transform:none}
  .msg.user{align-self:flex-end;background:var(--panel2);border:2px solid var(--edge2);border-bottom-right-radius:6px}
  .msg.ai{align-self:flex-start;background:var(--panel3);border:2px solid var(--edge);border-bottom-left-radius:6px}
  .msg.ai .label{display:block;font-size:11px;letter-spacing:2px;color:var(--gold);font-weight:800;text-transform:uppercase;margin-bottom:6px}
  .msg.ai p{margin:0 0 6px} .msg.ai p:last-child{margin:0}
  .msg.ai ul{margin:6px 0 0;padding-left:20px} .msg.ai li{margin:3px 0}
  .msg.typing{color:var(--dim)}
  .msg.typing .d{display:inline-block;width:7px;height:7px;margin-left:3px;border-radius:50%;background:var(--dim);animation:blink 1.1s infinite}
  .msg.typing .d:nth-child(2){animation-delay:.18s} .msg.typing .d:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,70%,100%{opacity:.22;transform:translateY(0)}35%{opacity:1;transform:translateY(-3px)}}

  /* Inmatningsrad */
  .inputbar{display:flex;gap:12px;padding:14px;background:var(--panel3);border-top:3px solid var(--edge)}
  .inputbar input{flex:1;min-width:0;background:var(--panel2);border:3px solid var(--edge2);border-radius:14px;
    color:var(--text);font:inherit;font-size:20px;padding:0 18px;height:var(--tap);
    transition:border-color 160ms var(--ease-out)}
  .inputbar input::placeholder{color:var(--dim)}
  .inputbar input:focus{outline:none;border-color:var(--gold)}
  .send{flex:none;height:var(--tap);min-width:118px;padding:0 26px;border:0;cursor:pointer;
    background:var(--gold);color:#241E0F;font:inherit;font-size:20px;font-weight:800;letter-spacing:1px;border-radius:14px;
    transition:transform 150ms var(--ease-out),opacity 150ms var(--ease-out)}
  .send:active{transform:scale(.97)}
  .send:disabled{opacity:.45;cursor:not-allowed}

  /* ── Snabbfrågor ── */
  .chips{width:356px;flex:none;display:flex;flex-direction:column;background:var(--panel);
    border:3px solid var(--edge);border-radius:18px;padding:16px;gap:12px}
  .chips h2{margin:0;font-size:12px;letter-spacing:2px;color:var(--gold);font-weight:800;text-transform:uppercase}
  .chips .scroll{overflow-y:auto;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
  .chip{display:flex;align-items:center;gap:13px;text-align:left;width:100%;min-height:var(--tap);
    padding:12px 16px;cursor:pointer;background:var(--panel2);border:2px solid var(--edge2);border-radius:14px;
    color:var(--text);font:inherit;font-size:18px;font-weight:700;line-height:1.3;
    transition:transform 150ms var(--ease-out),border-color 150ms var(--ease-out),background 150ms var(--ease-out);
    opacity:0;transform:translateY(8px)}
  .chip.in{opacity:1;transform:none}
  .chip:active{transform:scale(.97)}
  .chip:disabled{opacity:.45;cursor:not-allowed}
  .chip .ic{font-size:24px;flex:none;line-height:1}

  .chat::-webkit-scrollbar,.chips .scroll::-webkit-scrollbar{width:10px}
  .chat::-webkit-scrollbar-thumb,.chips .scroll::-webkit-scrollbar-thumb{background:var(--edge2);border-radius:6px}

  /* Hover bara på riktiga pekdon (inte touch → undvik falsk :hover på tryck) */
  @media (hover:hover) and (pointer:fine){ .chip:hover{border-color:var(--gold);background:var(--panel3)} }

  /* Portrait / smalt → chips under chatten */
  @media (max-aspect-ratio:1/1),(max-width:820px){
    .main{flex-direction:column}
    .chips{width:100%;flex:none;max-height:36vh}
    .chips .scroll{flex-direction:row;flex-wrap:wrap}
    .chip{width:auto;flex:1 1 46%}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition-duration:1ms!important;animation-duration:1ms!important}
    .msg,.chip{opacity:1!important;transform:none!important}
  }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">
      <div class="logo">🏝</div>
      <div>
        <h1>Strategicoachen</h1>
        <p>Maktspelet · taktik &amp; regler</p>
      </div>
    </div>
    <div class="status" id="status"><span class="dot"></span><span id="statustext">ansluter…</span></div>
  </div>

  <div class="main">
    <div class="chatwrap">
      <div class="chat" id="chat"></div>
      <form class="inputbar" id="form">
        <input id="input" type="text" autocomplete="off" enterkeyhint="send" placeholder="Skriv en egen fråga till coachen…" />
        <button type="submit" class="send" id="send">Fråga</button>
      </form>
    </div>

    <div class="chips">
      <h2>Snabbfrågor</h2>
      <div class="scroll" id="chips"></div>
    </div>
  </div>
</div>

<script>
  const CHIPS = [
    { ic:'🧭', q:'Vilken taktik ska vi välja?' },
    { ic:'🪙', q:'Hur får man tag på pengar?' },
    { ic:'🏝', q:'Hur räddar vi ön?' },
    { ic:'🌱', q:'Grönt eller smutsigt — vad ska vi bygga?' },
    { ic:'🗳', q:'Hur funkar omröstningen?' },
    { ic:'🔁', q:'Hur byter vi med andra lag?' },
    { ic:'🏆', q:'Hur blir vi rikast?' },
    { ic:'❤️', q:'Vad betyder öns hälsa?' },
  ];
  const $ = id => document.getElementById(id);
  const chatEl = $('chat'), chipsEl = $('chips'), form = $('form'),
        input = $('input'), sendBtn = $('send'), statusEl = $('status'), statusText = $('statustext');
  const history = []; let busy = false;

  // Chips med kort stagger (dekorativ, 40ms) — bra första intryck, blockerar inget.
  CHIPS.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'chip'; b.type = 'button';
    b.innerHTML = `<span class="ic">${c.ic}</span><span>${c.q}</span>`;
    b.addEventListener('click', () => ask(c.q));
    chipsEl.appendChild(b);
    setTimeout(() => b.classList.add('in'), 40 * i + 30);
  });

  const esc = s => s.replace(/[&<>]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[m]));
  function formatReply(text){
    const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
    let html = '', inList = false;
    for (const line of lines){
      const m = line.match(/^[-•*]\s+(.*)$/);
      if (m){ if (!inList){ html += '<ul>'; inList = true; } html += `<li>${esc(m[1])}</li>`; }
      else { if (inList){ html += '</ul>'; inList = false; } html += `<p>${esc(line)}</p>`; }
    }
    if (inList) html += '</ul>';
    return html;
  }
  function mount(d){ chatEl.appendChild(d); requestAnimationFrame(() => d.classList.add('show')); scroll(); }
  function addUser(t){ const d = document.createElement('div'); d.className = 'msg user'; d.textContent = t; mount(d); }
  function addAI(t){ const d = document.createElement('div'); d.className = 'msg ai';
    d.innerHTML = `<span class="label">Coachen</span>` + formatReply(t); mount(d); }
  function addTyping(){ const d = document.createElement('div'); d.className = 'msg ai typing'; d.id = 'typing';
    d.innerHTML = `<span class="label">Coachen</span><span class="d"></span><span class="d"></span><span class="d"></span>`; mount(d); }
  function removeTyping(){ $('typing')?.remove(); }
  function scroll(){ requestAnimationFrame(() => { chatEl.scrollTop = chatEl.scrollHeight; }); }
  function setBusy(b){ busy = b; sendBtn.disabled = b; document.querySelectorAll('.chip').forEach(c => c.disabled = b); }

  async function ask(text){
    if (busy || !text.trim()) return;
    const q = text.trim();
    addUser(q); history.push({ role:'user', content:q });
    input.value = ''; setBusy(true); addTyping();
    try{
      const res = await fetch('/chat', { method:'POST', headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ messages: history }) });
      const data = await res.json();
      removeTyping();
      const reply = data.reply || 'Jag kunde tyvärr inte svara just nu.';
      addAI(reply); history.push({ role:'assistant', content:reply });
    }catch(e){ removeTyping(); addAI('Kunde inte nå coachen. Kontrollera att servern är igång.'); }
    finally{ setBusy(false); input.focus(); }
  }
  form.addEventListener('submit', e => { e.preventDefault(); ask(input.value); });

  (async () => {
    try{
      const h = await (await fetch('/health')).json();
      if (h.keyed){ statusEl.className = 'status live'; statusText.textContent = 'Live · ' + h.model; }
      else { statusEl.className = 'status demo'; statusText.textContent = 'Demo-läge'; }
    }catch{ statusEl.className = 'status off'; statusText.textContent = 'Offline'; }
  })();

  addAI('Hej! Jag är er coach i Maktspelet. Tryck på en snabbfråga här intill, eller skriv en egen fråga om taktik och regler.');
</script>
</body>
</html>
