; Förstärkningsriggen — firmware. Samma kod på ESP8266 (prototyp) och ESP32 (husstandard).
; Prototyp nu:   pio run -e nodemcuv2 -t upload
; Husstandard:   pio run -e esp32dev -t upload      (byt även pinnar i src/config.h)
; S3 + PoE sen:  pio run -e esp32-s3 -t upload

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    fastled/FastLED@^3.7.0
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4

[env:nodemcuv2]            ; <-- Amica ESP8266 (prototypen du har inkopplad nu)
platform = espressif8266
board = nodemcuv2

[env:esp32dev]             ; <-- klassisk ESP32 (husstandard)
platform = espressif32
board = esp32dev

[env:esp32-s3]             ; <-- Waveshare ESP32-S3-POE-ETH (drift, kabel)
platform = espressif32
board = esp32-s3-devkitc-1
