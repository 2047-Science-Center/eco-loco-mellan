<meta name="claude:viewport-fit-sides" content="cover">
<title>Chrome-ikoner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700;800&display=swap">
<style>
  :root {
    --bg:#121009; --panel:#211E17; --panel3:#0C0B07; --edge:#4A443A; --edge2:#5C5547;
    --gold:#C9A94F; --text:#F2ECDD; --dim:#B8AF9A;
    --disp:"Oxanium","Avenir Next",system-ui,sans-serif; color-scheme: dark;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:var(--disp); line-height:1.4; }
  .wrap { max-width:820px; margin:0 auto;
          padding-left:max(16px, env(safe-area-inset-left,0px));
          padding-right:max(16px, env(safe-area-inset-right,0px));
          padding-block:30px 72px; }
  h1 { font-size:24px; letter-spacing:3px; color:var(--gold); font-weight:800; margin:0 0 6px; }
  p.lede { color:var(--dim); font-size:14px; margin:0 0 24px; max-width:600px; }
  .bar { display:flex; gap:12px; align-items:center; margin:0 0 26px; padding:12px 16px;
         background:var(--panel); border:2px solid var(--edge); border-radius:12px; }
  .bar .lbl { font-size:12px; letter-spacing:1.5px; color:var(--dim); font-weight:700; text-transform:uppercase; }
  .toggle { display:inline-flex; border:2px solid var(--edge2); border-radius:10px; overflow:hidden; }
  .toggle button { font:inherit; font-weight:800; font-size:13px; letter-spacing:1px; padding:8px 15px;
                   background:var(--panel3); color:var(--dim); border:0; cursor:pointer; }
  .toggle button.on { background:var(--gold); color:#241E0F; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; }
  .cell { background:var(--panel3); border:2px solid var(--edge2); border-radius:14px; padding:16px 12px 13px; text-align:center; }
  .cell .ic { height:72px; display:flex; align-items:center; justify-content:center; }
  .cell .nm { font-size:15px; font-weight:800; margin-top:10px; }
  .cell .was { font-size:12px; color:var(--dim); margin-top:3px; }
  .cell .use { font-size:11px; color:var(--gold); margin-top:5px; letter-spacing:.3px; }
</style>

<div class="wrap">
  <h1>CHROME-IKONER — UTKAST</h1>
  <p class="lede">Nya fasett-ikoner för kvarvarande emoji i chromet (B-listan). Samma recept som
    politik-ikonerna. Inget inlagt i spelet än — godkänn först, så lägger jag in dem i
    <code>src/icons.js</code>.</p>

  <div class="bar">
    <span class="lbl">Cirkel runt ikonen</span>
    <div class="toggle" id="tgl">
      <button data-c="0" class="on">UTAN</button>
      <button data-c="1">MED</button>
    </div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<script>
const D = '#1E1E1A';
const ICONS = {

  orad: `

    <rect x="16" y="34" width="68" height="7" fill="#B8AF9A"/>

    <rect x="22" y="41" width="4" height="34" fill="#F3ECDD"/>
    <rect x="37" y="41" width="9" height="34" fill="#D8D1C2"/>
    <rect x="37" y="41" width="4" height="34" fill="#F3ECDD"/>
    <rect x="52" y="41" width="9" height="34" fill="#D8D1C2"/>
    <rect x="52" y="41" width="4" height="34" fill="#F3ECDD"/>
    <rect x="67" y="41" width="9" height="34" fill="#D8D1C2"/>
    <rect x="67" y="41" width="4" height="34" fill="#F3ECDD"/>

    <rect x="11" y="80" width="78" height="6" fill="#8A8372"/>
    <rect x="11" y="80" width="78" height="2" fill="#B8AF9A"/>`,
  mal: `
    <circle cx="46" cy="54" r="30" fill="#F0564B"/>
    <circle cx="46" cy="54" r="30" fill="none" stroke="#B33A32" stroke-width="2"/>
    <circle cx="46" cy="54" r="20" fill="#F3ECDD"/>

    <line x1="46" y1="54" x2="84" y2="20" stroke="#8A8372" stroke-width="3.5"/>
    <polygon points="46,54 56,50 52,60" fill="#C9A94F"/>
    <polygon points="84,20 74,22 80,30" fill="#B8AF9A"/>`,
  happening: `

    <rect x="68" y="44" width="7" height="7" transform="rotate(-15 71 47)" fill="#F0564B"/>
    <rect x="60" y="34" width="6" height="6" transform="rotate(30 63 37)" fill="#8FB3C4"/>
    <rect x="78" y="58" width="6" height="6" transform="rotate(10 81 61)" fill="#C9A94F"/>

    <line x1="50" y1="20" x2="50" y2="30" stroke="#8A8372" stroke-width="3"/>

  bygge: `

    <rect x="40" y="36" width="10" height="9" fill="#5E8699"/>
    <line x1="76" y1="36" x2="76" y2="54" stroke="${D}" stroke-width="1.6"/>
    <polygon points="73,54 79,54 78,60 74,60" fill="#8A8372"/>
    <rect x="70" y="60" width="12" height="9" fill="#8A8372"/>
    <rect x="34" y="86" width="20" height="4" fill="#8A8372"/>`,
  bok: `
    <polygon points="50,34 20,30 20,74 50,78" fill="#F3ECDD"/>
    <polygon points="50,34 20,30 20,34 50,38" fill="#FFFFFF"/>
    <polygon points="50,34 80,30 80,74 50,78" fill="#E8E0CF"/>

    <line x1="26" y1="42" x2="44" y2="44" stroke="#B8AF9A" stroke-width="2"/>

    <line x1="56" y1="60" x2="74" y2="58" stroke="#B8AF9A" stroke-width="2"/>`,
};
const META = [
  { id:'vag',       nm:'vag',       was:'⚖️', use:'Dilemma / öråds-beslut' },
  { id:'orad',      nm:'orad',      was:'🏛️', use:'ÖRÅD / politik-rubrik' },
  { id:'mal',       nm:'mal',       was:'🎯', use:'KRIS-mål (öhälsa över X)' },
  { id:'happening', nm:'happening', was:'🎉', use:'Positiv händelse-banner' },
  { id:'bot',       nm:'bot',       was:'🤖', use:'Dator-styrt lag' },
  { id:'bygge',     nm:'bygge',     was:'🏗', use:'"byggde" i loggen' },
  { id:'bok',       nm:'bok',       was:'📖', use:'Årsberättelse-knapp' },
];

function svg(id, circle) {
  let ring = '', body = ICONS[id];
  if (circle) {
    ring = `<circle cx="50" cy="50" r="48" fill="#26251F"/>`
         + `<circle cx="50" cy="50" r="48" fill="none" stroke="#C9A94F" stroke-width="4"/>`
         + `<circle cx="50" cy="50" r="41" fill="none" stroke="#000" stroke-width="1.5" opacity="0.35"/>`;
    body = `<g transform="translate(50,50) scale(0.72) translate(-50,-50)">${body}</g>`;
  }
  return `<svg width="100%" height="100%" viewBox="0 0 100 100">${ring}${body}</svg>`;
}
let circle = false;
function render() {
  document.getElementById('grid').innerHTML = META.map(m =>
    `<div class="cell"><div class="ic">${svg(m.id, circle)}</div>
       <div class="nm">${m.nm}</div><div class="was">ersätter ${m.was}</div>
       <div class="use">${m.use}</div></div>`).join('');
}
document.getElementById('tgl').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  circle = b.dataset.c === '1';
  document.querySelectorAll('#tgl button').forEach(x => x.classList.toggle('on', x === b));
  render();
});
render();
</script>
