<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maktspelet — Intro-trailer (test)</title>
<!--
  TESTSIDA för intro-trailern v2 (2026-11-25). Skickar INGA egna ljus-cues längre (gamla sidan hade en
  egen CUE-lista = två källor). Allt går via servern, EN källa:
    • "Förhandsvisa här"  → filmen i den här fliken (tyst, startar själv) — ingen rigg, inget ljud.
    • "Kör i rummet"      → samma kommando som spelledarens 🎬-knapp: servern spelar trailern på ALLA
                            skärmar (synkat mot /time), startar masterljudet via hjärnan och ljus-cuesen
                            ur assets/trailer-film/rigg-cues.json.
  Filmen: assets/trailer-film/ (HyperFrames-paket). Källprojekt: ecoloco-produktion/trailer-film (utanför repot).
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #F2ECDD; font-family: system-ui, sans-serif; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  #panel { position: fixed; left: 16px; bottom: 16px; z-index: 2; display: flex; gap: 10px; }
  button { min-height: 48px; padding: 0 20px; border: 2px solid #C9A94F; border-radius: 10px; background: rgba(0,0,0,.6);
    color: #C9A94F; font: 700 16px system-ui, sans-serif; cursor: pointer; }
  #status { align-self: center; font-size: 13px; color: #B8AF9A; }
</style>
</head>
<body>
<iframe id="film" title="Intro-trailer" allow="autoplay"></iframe>
<div id="panel">
  <button id="har">FÖRHANDSVISA HÄR</button>
  <button id="rummet">KÖR I RUMMET</button>
  <span id="status"></span>
</div>
<script type="module">
import { ServerNet } from './src/net.js';
const $ = id => document.getElementById(id);
$('har').onclick = () => { $('film').src = 'assets/trailer-film/skarm.html?demo&debug'; };
let net = null;
$('rummet').onclick = async () => {
  try {
    if (!net) { net = new ServerNet(); await net.connect(null); }
    net.playTrailer();
    $('status').textContent = 'skickat till servern — trailern startar på alla skärmar';
  } catch (e) { $('status').textContent = 'ingen server: ' + e.message; }
};
</script>
</body>
</html>
